<!DOCTYPE html>
<html>
  <head>
    <title>ASF</title>
    <meta charset="utf-8">
    <meta name="robots" content="noindex">
    <meta content="IE=edge,chrome=1" http-equiv="X-UA-Compatible">
    <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport">
    <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600" rel="stylesheet">
    <link href="/manifest.json" rel="manifest" crossorigin="use-credentials">
    <link href="/images/logo.png" rel="shortcut icon">

    <script>
      // ASF may be served under a path prefix (Kestrel PathBase) that it does not tell us about (#1635).
      // If the main script fails to load from "/", we walk the current path backwards and retry from each parent.
      // html-webpack-plugin injects the main <script> right after this block, and the browser may dispatch its
      // error event before any later inline script could attach a handler, so we listen before the tag exists.
      // Listeners sit on document rather than window: "load" fired at an element never reaches window, even when capturing.
      window.__BASE_URL__ = window.location.origin + '/';
      window.__BASE_PATH__ = '/';

      document.addEventListener('error', onMainScriptError, true);
      document.addEventListener('load', onMainScriptLoad, true);

      function onMainScriptError(event) {
        const onError = resolveMainScript(event);
        if (onError) onError();
      }

      function onMainScriptLoad(event) {
        const onError = resolveMainScript(event);
        if (onError) createLoadHandler(onError)();
      }

      // Returns the error handler for the parser-inserted main script, or null for any other element
      // Runs at most once, retries created in createErrorHandler carry their own handlers
      function resolveMainScript(event) {
        const script = event.target;
        if (!(script instanceof HTMLScriptElement) || !(script.getAttribute('src') || '').startsWith('/scripts/main')) return null;

        document.removeEventListener('error', onMainScriptError, true);
        document.removeEventListener('load', onMainScriptLoad, true);

        return createErrorHandler(window.location.pathname, script.getAttribute('src'), script.getAttribute('integrity'));
      }

      function addScript(path, integrity) {
        const scriptElement = document.createElement('script');
        scriptElement.src = path;
        scriptElement.async = true;

        if (integrity) {
          scriptElement.integrity = integrity;
          scriptElement.crossOrigin = 'anonymous';
        }

        // The bundle mounts on #app synchronously, never let a retry run before the body is parsed
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', () => document.head.appendChild(scriptElement), { once: true });
        } else {
          document.head.appendChild(scriptElement);
        }

        return scriptElement;
      }

      function stripLastPart(path) {
        const lastIndexOfSlash = path.lastIndexOf('/');
        return path.slice(0, lastIndexOfSlash);
      }

      function createLoadHandler(onError) {
        return function() {
          // onLoad is fired when script is loaded. We do not want to be fooled by server returning index.html
          // Check if the script is indeed working can be achieved by testing __ASF_UI_LOADED__ property set in index.js
          if (!window.__ASF_UI_LOADED__) return onError();

          // It is possible we loaded main script on first attempt, resources already use the default path then
          if (window.__BASE_PATH__ === '/') return;

          document.querySelector('link[rel="shortcut icon"]').setAttribute('href', `${__BASE_PATH__}images/logo.png`);
          document.querySelector('link[rel="manifest"]').setAttribute('href', `${__BASE_PATH__}manifest.json`);
        };
      }

      function createErrorHandler(path, scriptPath, integrity) {
        return function() {
          // We are likely working with /<prefix>. Possible <browser path>:
          // a) We are on /<prefix>
          // b) We are on nested page /<prefix>/<page>
          // c) We are on deeply nested page /<prefix>/<page A>/<page B>
          // Either way, we need to load script from /<prefix>/<script path>

          // We start from <browser path> and work recursively by striping
          // parts after last "/" character:
          // 1. /<prefix>/<page A>/<page B>
          // 2. /<prefix>/<page A>
          // 3. /<prefix>

          const normalizedPath = path.endsWith('/') ? path.slice(0, -1) : path;
          if (!normalizedPath.length) return; // Give up

          // These properties needs to be set properly prior to script execution
          // Otherwise we will be downloading script chunks from base (incorrect) path
          window.__BASE_URL__ = window.location.href.replace(window.location.pathname, normalizedPath + '/');
          window.__BASE_PATH__ = normalizedPath + '/';

          // Add new script tag using new path
          const newScriptPath = normalizedPath + scriptPath;
          const newScript = addScript(newScriptPath, integrity);

          // We found the path! Replace other resources
          newScript.onerror = createErrorHandler(stripLastPart(normalizedPath), scriptPath, integrity);
          newScript.onload = createLoadHandler(newScript.onerror);
        };
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
